name: 每日更新时政要闻

# ---------------------------------------------------------------------------
# 前置要求：
#   ① 仓库为 Public（私有仓库用 GitHub Pages 需要付费版）。
#   ② 需在仓库设置里手动开启一次 Pages：Settings → Pages →
#      Build and deployment → Source 选「GitHub Actions」。
#      这一步无法自动化：创建 Pages 站点属仓库管理操作，Actions 自带的
#      GITHUB_TOKEN 在设计上就没有该权限（与 permissions: 无关）。
#      开启一次后，之后所有部署都由默认令牌自动完成。
#
# 更新时点：北京时间每天 08:02（另有 08:32 兜底重试）
#
# 为什么写 08:02 而不是 08:00？——GitHub 官方文档明确说明：
#   「schedule 事件在高负载时可能被延迟，高负载时段包括每小时整点；
#     若负载足够高，部分排队任务会被直接丢弃。」
#   所以刻意避开整点，用 08:02 显著降低被延迟或丢弃的概率。
#
# 为什么可以直接写北京时间？——GitHub 已支持在 cron 旁加 timezone 字段
#   （IANA 时区名），无需再手工做 UTC+8 换算。
#
# 兜底重试：脚本带 --skip-if-fresh，若 08:02 那次已成功出稿，
#   08:32 这次会直接跳过，不会重复抓取。
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '2 8 * * *'        # 北京时间 08:02 —— 主更新
      timezone: 'Asia/Shanghai'
    - cron: '32 8 * * *'       # 北京时间 08:32 —— 兜底重试
      timezone: 'Asia/Shanghai'

  # 推送到 main 时也跑一次：这样首次推送、或改了页面之后不用等到第二天早上。
  # 用 paths-ignore 排除 data/，避免「提交数据 → 触发工作流 → 又提交数据」的循环。
  # （实际上机器人用 GITHUB_TOKEN 提交的推送本来就不会触发工作流，这里是双保险。）
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
      - '.gitignore'

  workflow_dispatch:
    inputs:
      date:
        description: '目标日期（留空=今天，格式 YYYY-MM-DD）'
        required: false
        default: ''
      force:
        description: '无视 --skip-if-fresh，强制重新抓取'
        type: boolean
        required: false
        default: false
      fill:
        description: '凑不满十条时强行填充（质量会下降，慎用）'
        type: boolean
        required: false
        default: false

# 允许写回仓库（提交数据文件）并发布 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个，避免两次定时把数据文件写冲突
concurrency:
  group: gongkao-daily-update
  cancel-in-progress: false

jobs:
  update:
    name: 抓取并提交当日时政
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 自检只依赖标准库，几秒内跑完；失败会立刻中断，避免发布坏数据
      - name: 脚本自检（解析器 / 打标 / 去重 / 时效）
        run: python scripts/fetch_daily.py --selftest

      - name: 抓取当日时政要闻
        id: fetch
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.force }}" != "true" ]; then
            ARGS="$ARGS --skip-if-fresh"
          fi
          if [ "${{ inputs.fill }}" = "true" ]; then
            ARGS="$ARGS --fill"
          fi
          echo "运行参数：$ARGS"
          python scripts/fetch_daily.py $ARGS

      - name: 校验产出（条数 / 必填字段 / manifest 一致性）
        run: |
          python - <<'PY'
          import glob, os, re, sys
          files = sorted(glob.glob('data/20*.js'))
          assert files, 'data/ 下没有任何日期文件'
          bad = []
          for p in files:
              src = open(p, encoding='utf-8').read()
              d = os.path.basename(p)[:-3]
              n = src.count('    title:')
              for field in ('title:', 'summary:', 'source:', 'tag:'):
                  if field not in src:
                      bad.append('%s 缺少字段 %s' % (d, field))
              if n == 0:
                  bad.append('%s 一条内容都没有' % d)
              if 'undefined' in src or 'null,' in src:
                  bad.append('%s 出现了 undefined/null' % d)
              print('%-14s %2d 条' % (d, n))
          man = open('data/manifest.js', encoding='utf-8').read()
          dates = set(re.findall(r'"(\d{4}-\d{2}-\d{2})"', man))
          on_disk = {os.path.basename(f)[:-3] for f in files}
          if dates != on_disk:
              bad.append('manifest 与磁盘文件不一致：%s' % (on_disk ^ dates))
          print('manifest 共 %d 期' % len(dates))
          if bad:
              print('\n'.join('❌ ' + b for b in bad)); sys.exit(1)
          print('✅ 产出校验通过')
          PY

      - name: 提交数据文件
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据无变化，跳过提交。"
          else
            git commit -m "chore(data): 更新时政要闻 $(TZ=Asia/Shanghai date +%F)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "已提交并推送。"
          fi

      # 保存一份产物，便于在 Actions 页面直接下载查看
      - name: 归档本次产出
        uses: actions/upload-artifact@v4
        with:
          name: daily-data
          path: data/
          retention-days: 14

  deploy:
    name: 发布到 GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 重新检出分支最新提交，确保拿到 update 任务刚推上去的那一期数据
      - name: 拉取仓库（含刚提交的数据）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 只把线上需要的 12 个文件挑出来发布，开发脚手架不进 Pages 产物。
      # 同时会跑两项发布前校验：index.html 不能有外链、manifest 日期必须有对应文件。
      - name: 构建发布目录 dist/
        run: python scripts/build_dist.py

      # 说明：GitHub 出于安全设计，Actions 自带的 GITHUB_TOKEN **永远**没有「创建 Pages 站点」
      # 这一仓库管理权限（不管 permissions: 里写什么），所以 configure-pages 的
      # enablement: true 在这里必然失败。Pages 只能由人在设置页开启一次，之后永久生效。
      # 这里故意用 continue-on-error，把失败转成一条能看懂的指引，而不是抛一个莫名的错。
      - name: 配置 Pages
        id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages 未启用时给出明确指引
        if: steps.cfg.outcome != 'success'
        run: |
          echo "::error title=需要手动开启 GitHub Pages::请到仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」并保存，然后重新运行本工作流。"
          echo ""
          echo "为什么必须手动做这一次？"
          echo "  GitHub 不允许 Actions 自带的 GITHUB_TOKEN 执行「创建 Pages 站点」这类仓库管理操作，"
          echo "  这是刻意的安全边界。开启一次之后，后续所有部署都会用默认令牌自动完成。"
          echo ""
          echo "开启入口：https://github.com/${{ github.repository }}/settings/pages"
          exit 1

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
