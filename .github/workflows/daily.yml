name: 每日更新时政要闻

# ---------------------------------------------------------------------------
# 发布方式：把构建好的 dist/ 推到 gh-pages 分支，由 GitHub Pages 直接发布。
# 采用这种方式的原因：它只需要 contents: write，是纯 git 操作、零配置；
# 而 actions/deploy-pages 走的是 Pages API，要求仓库 Pages 设置为 build_type=workflow，
# 修改该设置属仓库管理操作，Actions 自带的 GITHUB_TOKEN 没有权限，必须人工进设置页开。
#
# 前置要求：仓库为 Public（私有仓库用 GitHub Pages 需要付费版）。
#           公共仓库首次推送 gh-pages 分支时，GitHub 会自动启用 Pages。
#
# 更新时点：北京时间每天 08:02（另有 08:32 兜底重试）
#
# 为什么写 08:02 而不是 08:00？——GitHub 官方文档明确说明：
#   「schedule 事件在高负载时可能被延迟，高负载时段包括每小时整点；
#     若负载足够高，部分排队任务会被直接丢弃。」
#   所以刻意避开整点，用 08:02 显著降低被延迟或丢弃的概率。
#
# 为什么可以直接写北京时间？——GitHub 已支持在 cron 旁加 timezone 字段
#   （IANA 时区名），无需再手工做 UTC+8 换算。
#
# 兜底重试：脚本带 --skip-if-fresh，若 08:02 那次已成功出稿，
#   08:32 这次会直接跳过，不会重复抓取。
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '2 8 * * *'        # 北京时间 08:02 —— 主更新
      timezone: 'Asia/Shanghai'
    - cron: '32 8 * * *'       # 北京时间 08:32 —— 兜底重试
      timezone: 'Asia/Shanghai'

  # 推送到 main 时也跑一次：这样首次推送、或改了页面之后不用等到第二天早上。
  # 用 paths-ignore 排除 data/，避免「提交数据 → 触发工作流 → 又提交数据」的循环。
  # （实际上机器人用 GITHUB_TOKEN 提交的推送本来就不会触发工作流，这里是双保险。）
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
      - '.gitignore'

  workflow_dispatch:
    inputs:
      date:
        description: '目标日期（留空=今天，格式 YYYY-MM-DD）'
        required: false
        default: ''
      force:
        description: '无视 --skip-if-fresh，强制重新抓取'
        type: boolean
        required: false
        default: false
      fill:
        description: '凑不满十条时强行填充（质量会下降，慎用）'
        type: boolean
        required: false
        default: false

# 允许写回仓库（提交数据文件）并发布 Pages
# 只需要 contents: write —— 提交数据 + 推送 gh-pages 分支都是普通 git 操作。
# 不需要 pages: write / id-token: write，因为本工作流不走 Pages API 部署。
permissions:
  contents: write

# 同一时间只跑一个，避免两次定时把数据文件写冲突
concurrency:
  group: gongkao-daily-update
  cancel-in-progress: false

jobs:
  update:
    name: 抓取并提交当日时政
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 自检只依赖标准库，几秒内跑完；失败会立刻中断，避免发布坏数据
      - name: 脚本自检（解析器 / 打标 / 去重 / 时效）
        run: python scripts/fetch_daily.py --selftest

      - name: 抓取当日时政要闻
        id: fetch
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.force }}" != "true" ]; then
            ARGS="$ARGS --skip-if-fresh"
          fi
          if [ "${{ inputs.fill }}" = "true" ]; then
            ARGS="$ARGS --fill"
          fi
          echo "运行参数：$ARGS"
          python scripts/fetch_daily.py $ARGS

      - name: 校验产出（条数 / 必填字段 / manifest 一致性）
        run: |
          python - <<'PY'
          import glob, os, re, sys
          files = sorted(glob.glob('data/20*.js'))
          assert files, 'data/ 下没有任何日期文件'
          bad = []
          for p in files:
              src = open(p, encoding='utf-8').read()
              d = os.path.basename(p)[:-3]
              n = src.count('    title:')
              for field in ('title:', 'summary:', 'source:', 'tag:'):
                  if field not in src:
                      bad.append('%s 缺少字段 %s' % (d, field))
              if n == 0:
                  bad.append('%s 一条内容都没有' % d)
              if 'undefined' in src or 'null,' in src:
                  bad.append('%s 出现了 undefined/null' % d)
              print('%-14s %2d 条' % (d, n))
          man = open('data/manifest.js', encoding='utf-8').read()
          dates = set(re.findall(r'"(\d{4}-\d{2}-\d{2})"', man))
          on_disk = {os.path.basename(f)[:-3] for f in files}
          if dates != on_disk:
              bad.append('manifest 与磁盘文件不一致：%s' % (on_disk ^ dates))
          print('manifest 共 %d 期' % len(dates))
          if bad:
              print('\n'.join('❌ ' + b for b in bad)); sys.exit(1)
          print('✅ 产出校验通过')
          PY

      - name: 提交数据文件
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据无变化，跳过提交。"
          else
            git commit -m "chore(data): 更新时政要闻 $(TZ=Asia/Shanghai date +%F)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "已提交并推送。"
          fi

      # 保存一份产物，便于在 Actions 页面直接下载查看
      - name: 归档本次产出
        uses: actions/upload-artifact@v4
        with:
          name: daily-data
          path: data/
          retention-days: 14

  deploy:
    name: 发布到 GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      # 重新检出分支最新提交，确保拿到 update 任务刚推上去的那一期数据
      - name: 拉取仓库（含刚提交的数据）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 只把线上需要的文件挑出来发布，开发脚手架不进产物。
      # 同时跑三项发布前校验：无外链、manifest 日期有对应文件、根目录有 index.html。
      - name: 构建发布目录 dist/
        run: python scripts/build_dist.py

      # 把 dist/ 推到 gh-pages 分支，由 GitHub Pages 直接发布。
      #
      # 为什么用「推送分支」而不是 actions/deploy-pages？
      #   后者属于 Pages API 部署，要求仓库的 Pages 设置为 build_type=workflow；
      #   而修改该设置属于仓库管理操作，Actions 自带的 GITHUB_TOKEN 没有这个权限。
      #   推送 gh-pages 分支则只需要 contents: write，是纯 git 操作，全自动、零配置、
      #   也不需要任何人进设置页。公共仓库推送该分支时 GitHub 会自动启用 Pages。
      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true          # 只保留一次提交，避免分支历史无限膨胀
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.repository.name }} 站点 ${{ github.run_number }}'
